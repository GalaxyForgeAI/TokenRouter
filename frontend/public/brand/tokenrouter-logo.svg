<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#D97706"/>
    </radialGradient>
  </defs>

  <!-- 外六边形：路由枢纽节点 -->
  <path d="M128 14 L220 65 L220 191 L128 242 L36 191 L36 65 Z" fill="url(#hexGrad)"/>

  <!-- 内六边形环：通道环 -->
  <path d="M128 48 L192 84 L192 172 L128 208 L64 172 L64 84 Z" fill="#10265C" opacity="0.35"/>

  <!-- 连接点：三条路由链路汇聚 -->
  <circle cx="128" cy="14" r="7" fill="#FFFFFF"/>
  <circle cx="220" cy="65" r="7" fill="#FFFFFF"/>
  <circle cx="220" cy="191" r="7" fill="#FFFFFF"/>
  <circle cx="128" cy="242" r="7" fill="#FFFFFF"/>
  <circle cx="36" cy="191" r="7" fill="#FFFFFF"/>
  <circle cx="36" cy="65" r="7" fill="#FFFFFF"/>

  <!-- 火炬火焰（炬）：路由核心 -->
  <path d="M128 74 C 152 106, 160 126, 160 148 A 32 32 0 0 1 96 148 C 96 126, 104 106, 128 74 Z" fill="url(#flameGrad)"/>
  <path d="M128 100 C 142 122, 146 134, 146 148 A 18 18 0 0 1 110 148 C 110 134, 114 122, 128 100 Z" fill="#FFFFFF" opacity="0.55"/>

  <!-- 核心：token 火花 -->
  <circle cx="128" cy="148" r="13" fill="url(#coreGrad)"/>
  <circle cx="123" cy="143" r="4" fill="#FFFFFF" opacity="0.85"/>
</svg>
