<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="0.45" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 徽章：圆角六边形（渐变蓝） -->
  <path d="M128 18 C 156 18, 172 30, 191 41 L 217 67 C 228 86, 238 102, 238 128 C 238 154, 228 170, 217 189 L 191 215 C 172 226, 156 238, 128 238 C 100 238, 84 226, 65 215 L 39 189 C 28 170, 18 154, 18 128 C 18 102, 28 86, 39 67 L 65 41 C 84 30, 100 18, 128 18 Z" fill="url(#bgGrad)"/>

  <!-- 顶部内侧高光（体积感） -->
  <path d="M65 41 C 84 30, 100 18, 128 18 C 156 18, 172 30, 191 41 L 177 58 C 161 48, 147 41, 128 41 C 109 41, 95 48, 79 58 Z" fill="#FFFFFF" opacity="0.16"/>

  <!-- 路由光束：三条轨迹汇聚到核心（炬：光路 + 枢纽） -->
  <path d="M128 216 C 128 188, 128 170, 128 154" stroke="url(#beamGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.92"/>
  <path d="M84 182 C 99 167, 113 155, 125 145" stroke="url(#beamGrad)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.72"/>
  <path d="M172 182 C 157 167, 143 155, 131 145" stroke="url(#beamGrad)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.72"/>

  <!-- 核心：token 光点 + 光晕 -->
  <circle cx="128" cy="148" r="27" fill="url(#coreHalo)"/>
  <circle cx="128" cy="148" r="12.5" fill="url(#coreGrad)"/>
  <circle cx="123.5" cy="143.5" r="3.6" fill="#FFFFFF" opacity="0.85"/>
</svg>
