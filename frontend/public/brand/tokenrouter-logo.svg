  <path d="M128 96 C 143 119, 148 131, 148 146 A 20 20 0 0 1 108 146 C 108 131, 113 119, 128 96 Z" fill="#FFFFFF" opacity="0.6"/>

  <!-- 核心：token 火花 -->
  <circle cx="128" cy="146" r="15" fill="url(#coreGrad)"/>
  <circle cx="122" cy="140" r="4.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
